name: structcalc
description: "StructCalc — calcul de descente de charges et prédimensionnement en béton armé."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Variable.ttf
          weight: 700
        - asset: assets/fonts/DMSans-Italic-Variable.ttf
          weight: 400
          style: italic
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 700
