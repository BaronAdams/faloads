name: Build Tauri mobile
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tauri-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    name: Build Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NDK_VERSION: "27.2.12479018"
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-arm64
      - run: npm ci
      - run: npm run icons
      - run: npm run tauri android init -- --ci --skip-targets-install
      - run: npm run tauri android build -- --ci --target aarch64 --apk
      - name: Sign installable APK
        run: bash tools/sign-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: structcalc-tauri-android-arm64
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 14
  ios:
    name: Build iOS simulator
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-simulator
      - run: npm ci
      - run: npm run icons
      - run: npm run tauri ios init -- --ci --skip-targets-install
      - run: npm run tauri ios build -- --ci --target aarch64-sim --no-sign --archive-only
      - name: Package simulator application
        run: |
          APP_PATH=$(find src-tauri/gen/apple -type d -name '*.app' -path '*/build/*' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" structcalc-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: structcalc-tauri-ios-simulator
          path: structcalc-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
