name: Build desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: "3.47.9"

jobs:
  build_desktop:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            archive: structcalc-windows.zip
          - platform: macos
            os: macos-latest
            archive: structcalc-macos.zip
          - platform: linux
            os: ubuntu-latest
            archive: structcalc-linux.tar.gz
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Platform folders are generated, just as in the mobile workflow.
      # Keep the project name stable so the executable and .app names match.
      - name: Generate desktop platform
        run: flutter create --platforms=${{ matrix.platform }} --org com.structcalc --project-name structcalc --no-pub .

      # flutter create rewrites pubspec.lock even with --no-pub. Restore
      # the reviewed dependency set before resolving anything.
      - name: Restore locked dependencies
        run: git restore -- pubspec.lock

      - name: Apply Windows startup runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item tool/windows/main.cpp windows/runner/main.cpp -Force

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build release
        run: flutter build ${{ matrix.platform }} --release

      # Package the entire bundle: the executable needs its libraries and assets.
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/windows/package.ps1

      - name: Launch extracted Windows release (default and compatibility)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/windows/smoke.ps1 -Archive structcalc-windows.zip

      - name: Upload Windows startup diagnostics
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: structcalc-windows-diagnostics
          path: windows-smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/structcalc.app structcalc-macos.zip

      - name: Package Linux application
        if: runner.os == 'Linux'
        run: tar -czf structcalc-linux.tar.gz -C build/linux/x64/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: structcalc-${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14
